[workspace]
resolver = "2"
members = [
    "crates/vault-core",
    "crates/history",
    "crates/rpc",
    "crates/graphite-mcp",
    "crates/sync-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
publish = false

[workspace.dependencies]
tauri = "2.11"
tauri-build = "2.6"
tauri-plugin-single-instance = "2.4"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
comrak = "0.53"
rmcp = { version = "2.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
ulid = "1"
base64 = "0.22"
fd-lock = "4"
interprocess = { version = "2", features = ["tokio"] }
blake3 = "1"
zstd = "0.13"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
