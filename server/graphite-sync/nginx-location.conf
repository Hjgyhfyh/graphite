# Graphite Sync — вставляется в server-блок telepasta.ru (listen 443 ssl),
# перед закрывающей "}" этого server-блока.
# Проксирует https://telepasta.ru/graphite-sync/ -> http://127.0.0.1:8130/
#
# ВАЖНО: завершающий "/" в proxy_pass срезает префикс /graphite-sync/, поэтому
#        GET /graphite-sync/health  ->  бэкенд видит  GET /health.

location /graphite-sync/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 25m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    proxy_pass http://127.0.0.1:8130/;
}
